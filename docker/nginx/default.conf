upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Must be >= MAX_UPLOAD_SIZE_MB (20 MB) plus a little overhead.
    client_max_body_size 25M;

    # Serve collected static + uploaded media directly from nginx.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

